<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
<!--Link para poner un ícono a la pestaña del navegador-->
 <link rel="icon" type="image/svg" th:href="@{/img/colegio.svg}" />

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/estilos.css}">

<title>Página no encontrada</title>

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>


	<main class="container mt-5">

		<div class="text-center">

			<h1 class="display-1 fw-bold">404</h1>

			<h2>Recurso no encontrado</h2>

			<p class="lead" th:if="${mensaje}" th:text="${mensaje}"></p>

			<p th:unless="${mensaje}">El recurso solicitado no existe.</p>

			<a th:href="@{/}" class="btn btn-primary"> Volver al inicio </a>

		</div>

	</main>


	<div th:replace="~{fragments/footer :: footer}"></div>


<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>
</body>

</html>
