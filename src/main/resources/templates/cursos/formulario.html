<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
<!--Link para poner un ícono a la pestaña del navegador-->
 <link rel="icon" type="image/svg" th:href="@{/img/colegio.svg}" />

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- CSS propio -->
<link rel="stylesheet" th:href="@{/css/estilos.css}">

<title>Curso | Academia</title>
</head>
<body>
	<!-- Navbar -->
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<!-- Contenido -->
	<main class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow">
					<div class="card-header bg-dark text-white">
						<h4 class="mb-0"
							th:text="${cursoDTO.id == null ? 'Nuevo Curso': 'Editar Curso'}">
							Nuevo Curso</h4>
					</div>
					<div class="card-body">
						<form th:action="@{/cursos/guardar}" th:object="${cursoDTO}"
							method="post">
							<!-- ID -->
							<input type="hidden" th:field="*{id}">

							<!-- NOMBRE -->
							<div class="mb-3">
								<label for="nombre" class="form-label"> Nombre del curso </label>
								<input type="text" id="nombre" class="form-control"
									th:field="*{nombre}" placeholder="Ej: Cálculo I"
									maxlength="150" required>
								<div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors='*{nombre}'>
								</div>
							</div>

							<!-- SEMESTRE -->
							<div class="mb-3">
								<div class="mb-3">
									<label for="semestre" class="form-label"> Semestre </label>
									<select id="semestre" th:field="*{semestre}" class="form-select">
										<option value="">Seleccione un semestre</option>
										<option th:each="semestre : ${semestres}" th:value="${semestre}" th:text=${semestre}></option>
									</select>	
									<div class="text-danger small" th:if="${#fields.hasErrors('semestre')}" th:errors='*{semestre}'>
									</div>
								</div>
							</div>

							<!-- BOTONES -->
							<div class="d-flex justify-content-between">
								<a th:href="@{/cursos}" class="btn btn-secondary"> Cancelar
								</a>
								<button type="submit" class="btn btn-primary">Guardar</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>


	<!-- Footer -->
	<div th:replace="~{fragments/footer :: footer}"></div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
