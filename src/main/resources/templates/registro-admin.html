<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
<!--Link para poner un ícono a la pestaña del navegador-->
 <link rel="icon" type="image/svg" th:href="@{/img/colegio.svg}" />

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link th:href="@{/css/estilos.css}" rel="stylesheet">

<title>Registro Administrador | Academia</title>
</head>
<body>
	<div class="container ">
		<div class="row justify-content-center mt-5">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow">
					<div class="card-header bg-dark text-white text-center">
						<h4 class="mb-0">Crear cuenta Administrador</h4>
					</div>
					<div class="card-body">
						<!-- Error general -->
						<div th:if="${error}" class="alert alert-danger"
							th:text="${error}"></div>
						<form th:action="@{/registro-admin}" th:object="${registroUsuario}"
							method="post">
							<!-- Email -->
							<div class="mb-3">
								<label for="email" class="form-label"> Email </label> <input
									type="email" id="email" class="form-control"
									th:field="*{email}" placeholder="usuario@email.com">
								<div class="text-danger small"
									th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
								</div>
							</div>
							<!-- Password -->
							<div class="mb-3">
								<label for="password" class="form-label"> Contraseña </label> <input
									type="password" id="password" class="form-control"
									th:field="*{password}" placeholder="Mínimo 6 caracteres">
								<div class="text-danger small"
									th:if="${#fields.hasErrors('password')}"
									th:errors="*{password}"></div>
							</div>
							<!-- Confirm Password -->
							<div class="mb-3">
								<label for="confirmPassword" class="form-label">
									Confirmar contraseña </label> <input type="password"
									id="confirmPassword" class="form-control"
									th:field="*{confirmPassword}">
								<div class="text-danger small"
									th:if="${#fields.hasErrors('confirmPassword')}"
									th:errors="*{confirmPassword}"></div>
							</div>
							<!-- Botón -->
							<div class="d-grid">
								<button type="submit" class="btn btn-primary">Crear
									cuenta Administrador</button>
							</div>
						</form>
						<div class="text-center mt-4">
							<a th:href="@{/login}"> ¿Ya tienes una cuenta? Ingresar </a>
						</div>
						<div class="text-center mt-3">
							<a th:href="@{/}"> ← Volver al inicio </a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
		
	</script>
	

</body>
</html>
