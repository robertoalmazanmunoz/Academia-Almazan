<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Roberto Marcos Almazán Muñoz - roberto.almazan.m@gmail.com">
<!--Link para poner un ícono a la pestaña del navegador-->
 <link rel="icon" type="image/svg" th:href="@{/img/colegio.svg}" />

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
	rel="stylesheet">

<link th:href="@{/css/estilos.css}" rel="stylesheet">

<title th:text="${estudianteDTO.id == null ? 'Nuevo Estudiante' : 'Editar Estudiante'}">
	Nuevo Estudiante</title>
</head>

<body>
	<!-- NAVBAR -->
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<!-- CONTENIDO -->
	<main class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-7">
				<div class="card shadow-sm">
					<div class="card-header">
						<h2 class="mb-0"
							th:text="${estudianteDTO.id == null ? 'Nuevo Estudiante' : 'Editar Estudiante'}">
							Nuevo Estudiante</h2>
					</div>
					<div class="card-body">
						<form th:action="@{/estudiantes/guardar}" th:object="${estudianteDTO}"
							method="post">
							<!-- ID -->
							<input type="hidden" th:field="*{id}">
							<!-- RUT -->
							<div class="mb-3">
								<label for="rut" class="form-label"> Rut </label> <input
									type="text" id="rut" th:field="*{rut}"
									class="form-control" placeholder="Ingrese el rut del estudiante. Ej: 12345678-9"
									required>
								<div class="text-danger" th:if="${#fields.hasErrors('rut')}"
									th:errors="*{rut}"></div>
							</div>
							<!-- NOMBRE -->
							<div class="mb-3">
								<label for="nombre" class="form-label"> Nombre </label> <input
									type="text" id="nombre" th:field="*{nombre}" class="form-control"
									placeholder="Ingrese el nombre completo del estudiante." required>
								<div class="text-danger" th:if="${#fields.hasErrors('nombre')}"
									th:errors="*{nombre}"></div>
							</div>
							<!-- FECHA NACIMIENTO -->
							<div class="mb-3">
								<label for="fecha_nac" class="form-label"> Fecha de Nacimiento </label> <input
									type="date" id="fecha_nac" th:field="*{fecha_nac}" class="form-control"
									placeholder="Ingrese la fecha de nacimiento del estudiante." required>
								<div class="text-danger" th:if="${#fields.hasErrors('fecha_nac')}"
									th:errors="*{fecha_nac}"></div>
							</div>
							<!-- GÉNERO -->
							<div class="mb-3">
								<label for="genero" class="form-label"> Género </label> <select
									id="genero" th:field="*{genero}" class="form-select" required>
									<option value = "">Seleccione un género:</option>
									<option value="MASCULINO">Masculino</option>
    								<option value="FEMENINO">Femenino</option>
    								<option value="OTRO">Otro / Prefiero no decirlo</option> </select>
								<div class="text-danger" th:if="${#fields.hasErrors('genero')}"
									th:errors="*{genero}"></div>
							</div>
							<!-- TELÉFONO -->
							<div class="mb-3">
								<label for="telefono" class="form-label"> Teléfono </label> <input
									type="text" id="telefono" th:field="*{telefono}" class="form-control"
									placeholder="Ingrese el teléfono del estudiante. Ej: +56924561256">
								<div class="text-danger" th:if="${#fields.hasErrors('telefono')}"
									th:errors="*{telefono}"></div>
							</div>
							<!-- CURSO -->
							<div class="mb-3">
								<label for="cursoId" class="form-label"> Curso </label> <select
									id="cursoId" th:field="*{cursoId}" class="form-select" required>
									<option value="">Seleccione un curso:</option>
									<option th:each="curso : ${cursos}" th:value="${curso.id}"
										th:text="${curso.nombre}"></option>
								</select>
								<div class="text-danger" th:if="${#fields.hasErrors('cursoId')}"
									th:errors="*{cursoId}"></div>
							</div>
							<!-- CARRERA -->
							<div class="mb-3">
								<label for="carrera" class="form-label"> Carrera </label> <input
									type="text" id="carrera" th:field="*{carrera}" class="form-control"
									placeholder="Ingrese la carrera del estudiante. Ej: Ingeniería">
								<div class="text-danger" th:if="${#fields.hasErrors('carrera')}"
									th:errors="*{carrera}"></div>
							</div>
							<!-- AÑO -->
							<div class="mb-3">
								<label for="año" class="form-label"> Año en curso
								</label> <input type="number" id="año" th:field="*{año}"
									class="form-control" placeholder="Ingrese el año en curso del estudiante." min="0">
								<div class="text-danger" th:if="${#fields.hasErrors('año')}"
									th:errors="*{año}"></div>
							</div>

							<div class="d-flex gap-2 mt-4">
								<button type="submit" class="btn btn-primary">
									<i class="bi bi-save"></i> Guardar
								</button>
								<a th:href="@{/estudiantes}" class="btn btn-secondary"> <i
									class="bi bi-arrow-left"></i> Cancelar
								</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- FOOTER -->
	<div th:replace="~{fragments/footer :: footer}"></div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>
</html>
